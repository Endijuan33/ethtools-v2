<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EthTools">
  <!--
    EthTools brand mark — original artwork, no third-party assets.

    A hexagonal bolt head (the "tools" half of the name) whose hex socket
    doubles as the six-sided shape the Ethereum ecosystem is visually
    associated with. Deliberately a plain hexagon rather than the
    Ethereum Foundation's diamond mark, so the mark is unencumbered.
    Gradient stops match the app's --primary and --info design tokens.
  -->
  <defs>
    <linearGradient id="ethtools-tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#ethtools-tile)" />

  <!-- Bolt head: white pointy-top hexagon, centre (256,256), R 168 -->
  <polygon
    points="256,88 401.5,172 401.5,340 256,424 110.5,340 110.5,172"
    fill="#ffffff"
  />

  <!-- Hex socket: gradient flat-top hexagon, centre (256,256), r 64.
       Same userSpaceOnUse gradient as the tile, so it reads as a cutout. -->
  <polygon
    points="320,256 288,311.4 224,311.4 192,256 224,200.6 288,200.6"
    fill="url(#ethtools-tile)"
  />
</svg>
