name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: verification only needs to read the checked-out code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs (supply-chain hardening);
      # the version comments are kept so Dependabot's github-actions
      # updater can still propose bumps.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # pnpm verify runs typecheck + lint + test; the production build is a
      # separate step because `verify` does not include it.
      - name: Verify (typecheck, lint, unit tests)
        run: pnpm verify

      - name: Production build
        run: pnpm build

      # Dependency audit gate: scans every package in the lockfile against
      # OSV. Fails on any advisory not covered by a justified, unexpired
      # entry in .osv-ignore.json — see scripts/osv-audit.mjs.
      - name: Dependency audit (OSV)
        run: pnpm audit:osv
