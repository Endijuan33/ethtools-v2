name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: verification only needs to read the checked-out code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # pnpm verify runs typecheck + lint + test; the production build is a
      # separate step because `verify` does not include it.
      - name: Verify (typecheck, lint, unit tests)
        run: pnpm verify

      - name: Production build
        run: pnpm build
